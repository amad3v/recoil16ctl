[formatting]
# Keep the formatter conservative and readable.
align_entries = false
align_comments = true
array_trailing_comma = true
array_auto_expand = true
array_auto_collapse = true
compact_arrays = true
compact_inline_tables = false
inline_table_expand = true
compact_entries = false
column_width = 100
indent_tables = false
indent_entries = false
indent_string = "  "
trailing_newline = true
reorder_keys = false
reorder_arrays = false
allowed_blank_lines = 1
crlf = false

# Cargo.toml: sort dependency tables, but leave everything else alone.
[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies", "dev-dependencies", "build-dependencies", "target.*.dependencies"]

[rule.formatting]
reorder_keys = true
align_entries = false
